<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Subtle warm vignette for depth -->
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="62%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F0EFEC" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect
    x="0" y="0" width="512" height="512" rx="104" ry="104"
    fill="url(#bg-glow)"
    stroke="#E8E8E6"
    stroke-width="1.5"
  />

  <!--
    Main motif: a flowing calligraphic arc — inspired by a musical slur or
    a single singing breath. The curve rises gently, peaks, then descends
    with a soft tail, evoking an aria phrase. Composed as one continuous
    cubic-Bézier path, centered in the canvas.

    Concept: idea 3 — a broad, graceful arc with a terminal dot.
    The path starts at lower-left, sweeps upward in a broad arch, then
    curves back down with a slight S-inflection at the end (like the
    natural decay of a sung note), terminating at the dot position.
  -->

  <!-- Primary arc — the aria breath -->
  <path
    d="
      M 118, 318
      C 148, 180  260, 148  310, 192
      C 360, 236  340, 318  390, 290
    "
    fill="none"
    stroke="#1A1A1A"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Secondary echo arc — harmony, sits slightly below and shorter,
       reinforcing the flowing melody idea (idea 2 + 3 combined) -->
  <path
    d="
      M 148, 358
      C 172, 268  268, 240  316, 272
      C 352, 298  358, 346  394, 334
    "
    fill="none"
    stroke="#1A1A1A"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.18"
  />

  <!-- Terminal dot — the note, the breath's resolution -->
  <!-- Placed at the natural end of the primary arc path (≈ 390, 290) -->
  <circle
    cx="390" cy="290"
    r="18"
    fill="#7C9885"
  />

</svg>
