<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFAF8"/>
      <stop offset="100%" style="stop-color:#F2F2EE"/>
    </linearGradient>
  </defs>

  <!-- Delicate Squircle Frame -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" 
        fill="url(#bgGrad)" stroke="#E5E4DE" stroke-width="2.5"/>

  <!-- Aria Line Art (詠嘆調：純粹悠揚的單線旋律與泛音) -->
  <g fill="none" stroke="#1A1A1A" stroke-linecap="round" stroke-linejoin="round">
    <!-- Continuous vocal / acoustic melodic line -->
    <path d="M 116,346 
             C 176,346 206,306 226,236 
             C 246,166 286,136 336,156 
             C 386,176 396,236 356,296 
             C 316,356 246,376 196,326 
             C 156,286 166,216 206,166 
             C 246,116 316,106 396,136" 
          stroke-width="12" opacity="0.95"/>

    <!-- Subtle resonance contour (弦音餘韻) -->
    <path d="M 148,276 
             C 210,276 256,236 306,196 
             C 336,172 366,176 386,196" 
          stroke-width="4.5" opacity="0.3"/>
  </g>

  <!-- Floating Harmonic Overtone (詠嘆泛音) -->
  <circle cx="346" cy="118" r="9" fill="#7C9885"/>
</svg>
