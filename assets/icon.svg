<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rounded container -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="#FAFAF9" stroke="#E0DFD9" stroke-width="3"/>

  <!-- Abstract aria glyph: a single flowing breath curve — like a voice rising and falling.
       Three arcs: an ascending breath, a held peak, a descending release. Pure line. -->
  <g fill="none" stroke="#1A1A1A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main ascending arc — the inhale -->
    <path d="M 120,310 C 140,200 200,160 256,160"/>
    <!-- Held peak arc — the note sustained -->
    <path d="M 256,160 C 310,160 348,196 348,248 C 348,300 310,336 256,336"/>
    <!-- Descending tail — the release, trails to a small dot -->
    <path d="M 256,336 C 220,336 196,312 196,280"/>
  </g>

  <!-- The signature accent dot of "aria." -->
  <circle cx="372" cy="348" r="16" fill="#7C9885"/>
</svg>
